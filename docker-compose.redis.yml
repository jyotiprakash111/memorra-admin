# Local Redis for development
# Usage: npm run redis:up
# Then set REDIS_URL=redis://localhost:6379 in .env

services:
  redis:
    image: redis:7-alpine
    container_name: memorra-redis
    ports:
      - "6379:6379"
    volumes:
      - memorra_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  memorra_redis_data:
